<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario CSS</title>
    <style>
        div {
            float: left;
            margin: 0px 5%;
        }

        select,
        label,
        input {
            margin: 20px 0px;
        }

        select, input {
            border: 0px;
            border-bottom: 2px solid black;
            outline: none;
            transition: 0.5s ease;
            width: 100%;
        }
        input:focus {
            border-bottom: 2px solid #00ff00;
        }
        select {
            background-color: white;
        }
        button {
            width: 150px;
            height: 40px;
            font-size: 14px;
            border-radius: 15px;
            background: black;
            color: white;
            font-weight: bolder;
            transition: 0.3s ease;
        }
        button:hover {
            background-color: greenyellow;
            color: black;
        }

    </style>
</head>

<body style=" margin: 0; font-family: 'Courier New', Courier, monospace;">
    <header style=" color: white; background-color: black; display: flex; justify-content: center; align-items: center;">
        <h1>Formulario com CSS</h1>
    </header>
    <form style="margin: 50px auto; width: 100%; " action="">
        <div style="width: 20%; ">
            <label for="name">Nome: </label>
            <input type="text" name="name" id="name" required />
        </div>
        <div style="width: 60%; ">
            <label for="surname">Sobre Nome: </label>
            <input type="text" name="surname" id="surname" required />
        </div>
        <div style="width: 45%; ">
            <label for="email">Email </label>
            <input type="text" name="email" id="email" required />
        </div>
        <div style="width: 12%; ">
            <label for="born">Data de Nascimento </label>
            <input type="date" name="born" id="born"  />
        </div>
        <div style="width: 12%; ">
            <label for="gender">Genero</label>
            <select name="gender" id="gender">
                <option value="" selected disabled hidden>Escolha o gênero</option>
                <option value="man">😎 Homem</option>
                <option value="woman">👩 Mulher</option>
            </select>
        </div>
        <div style="display: flex; justify-content: center; width: 100%; gap: 5%; margin: 2% 5%;">
            <button type="submit"> Cadastrar</button>
            <button type="reset">Limpar</button>
        </div>
    </form>

</body>

</html>
