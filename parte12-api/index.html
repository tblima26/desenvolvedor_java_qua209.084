<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastro</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body class="bg-light">
    <div class="container vh-100 d-flex justify-content-center align-items-center">

      <div class="card shadow-lg border-0 rounded-4 p-4" style="width: 500px">

        <form>

          <h3 class="text-center fw-bold mb-4">Cadastrar</h3>

          <!-- Nome -->
          <div class="d-flex align-items-center mb-3">
            <label for="nome" class="me-3 fw-semibold" style="width: 70px">
              Nome
            </label>
            <input type="text" id="nome" class="form-control" />
          </div>

          <!-- Telefone -->
          <div class="d-flex align-items-center mb-3">
            <label for="tel" class="me-3 fw-semibold" style="width: 70px">
              Telefone
            </label>
            <input type="text" id="tel" class="form-control" />
          </div>

          <!-- Email -->
          <div class="d-flex align-items-center mb-3">
            <label for="email" class="me-3 fw-semibold" style="width: 70px">
              Email
            </label>
            <input type="email" id="email" class="form-control" />
          </div>

          <!-- CPF -->
          <div class="d-flex align-items-center mb-4">
            <label for="cpf" class="me-3 fw-semibold" style="width: 70px">
              CPF
            </label>
            <input type="text" id="cpf" class="form-control" />
          </div>

          <hr class="my-4" />

          <h5 class="text-center fw-bold mb-4">Consulta de CEP</h5>

          <!-- CEP + Botão -->
          <div class="row align-items-end mb-3">

            <div class="col-md-8">
              <label for="cep" class="form-label fw-semibold">CEP</label>
              <input type="text" id="cep" class="form-control" />
            </div>

            <div class="col-md-4">
              <!-- 🔥 AQUI ESTAVA O ERRO -->
              <button type="button" id="buscar-cep" class="btn btn-secondary w-100">
                Buscar CEP
              </button>
            </div>

          </div>

          <!-- Logradouro -->
          <div class="mb-3">
            <label for="logradouro" class="form-label fw-semibold">
              Logradouro
            </label>
            <input type="text" id="logradouro" class="form-control" readonly />
          </div>

          <!-- Complemento -->
          <div class="mb-3">
            <label for="complemento" class="form-label fw-semibold">
              Complemento
            </label>
            <input type="text" id="complemento" class="form-control"/>
          </div>

          <!-- UF + DDD -->
          <div class="row">

            <div class="col-md-6 mb-3">
              <label for="uf" class="form-label fw-semibold">UF</label>
              <input type="text" id="uf" class="form-control" readonly />
            </div>

            <div class="col-md-6 mb-4">
              <label for="ddd" class="form-label fw-semibold">DDD</label>
              <input type="text" id="ddd" class="form-control" readonly />
            </div>

          </div>

          <!-- Botão principal -->
          <button type="submit" class="btn btn-primary w-100 rounded-3" id="send">
            Enviar
          </button>

        </form>

      </div>
      <div id="resultado" class="ms-5"></div>
    </div>

    <script src="js/script.js"></script>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      crossorigin="anonymous"
    ></script>

  </body>
</html>
